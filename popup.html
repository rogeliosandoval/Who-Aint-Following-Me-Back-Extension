<!DOCTYPE html>
<html>
  <head>
    <title>Instagram Scraper</title>
    <link rel="stylesheet" href="/styles-min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    
    <div class="title">
      <img class="main-logo" src="/images/logo-light.svg" alt="logo">
      <select name="social">
        <option value="Instagram">Instagram</option>
        <option disabled>--Comming Soon--</option>
        <option value="TikTok" disabled>TikTok</option>
        <option value="X" disabled>X (Twitter)</option>
        <option value="Facebook" disabled>Facebook</option>
        <option value="GitHub" disabled>GitHub</option>
      </select>
      <div class="sub-title">
        <img src="/images/instagram-icon.svg" alt="instagram-icon">
        <p>Instagram Addition</p>
        <button id="resetBtn">Reset Data</button>
      </div>
    </div>

    <span id="mainError" style="color: rgb(255, 59, 59); font-size: 1rem; letter-spacing: 0; margin-bottom: 1rem; text-align: center; display: block; margin-top: 0.5rem; padding: 0 1rem;"></span>

    <div class="loader-container" id="loader">
      <div class="loader"></div>
      <div class="loader-label">Working on it...</div>
    </div>

    <div class="upload-section" id="uploadSection">
      <input type="file" id="zipInput" accept=".zip" />
      <label class="upload-label">Drag & Drop your ZIP file here<br>or click to browse</label>
    </div>

    <div id="output"></div>

    <div class="actions">
      <button class="downloadCsvBtn" id="downloadCsvBtn">
        <p>Download CSV</p>
      </button>
    </div>

    <script src="lib/jszip.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
